name: manifest

on:
  push:
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache.appcache is how the console picks up a new build: it refetches
      # only when the manifest itself changes, and the manifest carries the
      # hash of every file it lists. A stale manifest therefore keeps serving
      # the old page with no error anywhere -- the failure that broke the
      # previous Crystallize fork silently. This fails the build instead.
      - name: cache.appcache matches the files it lists
        run: |
          fail=0
          n=0
          while IFS= read -r line; do
            case "$line" in
              ''|'# '*|'CACHE MANIFEST'|'NETWORK:'|'*') continue ;;
            esac
            f=${line%% *}
            h=${line##*#}
            if [ "$f" = "$line" ] || [ ${#h} -ne 32 ]; then
              echo "::error::malformed cache.appcache line: $line"
              fail=1
              continue
            fi
            n=$((n+1))
            if [ ! -f "$f" ]; then
              echo "::error file=$f::listed in cache.appcache but missing"
              fail=1
              continue
            fi
            real=$(sha256sum "$f" | cut -c1-32)
            if [ "$real" != "$h" ]; then
              echo "::error file=$f::manifest says $h, file is $real -- run ./make-manifest.sh"
              fail=1
            fi
          done < cache.appcache
          if [ "$n" -eq 0 ]; then
            echo "::error::no entries parsed from cache.appcache"
            fail=1
          fi
          exit $fail

      # 14.00'te yamalanmamış hen.bin her uygulama açılışında konsolu dondurur
      # (sceSblPfsSetKeys adresi). Bu yüzden payload'ın kimliği sabitlenir:
      # yanlış dosya ya da cache'ten düşmüş bir kayıt build'i durdurur.
      - name: hen.bin is the patched build and is cached
        run: |
          patched=6417a84a72f9c7988f0e33b3ae190542
          broken=9aff7544eddef2f8202f72fc633d2be3
          got=$(md5sum hen.bin | cut -d' ' -f1)
          if [ "$got" = "$broken" ]; then
            echo "::error file=hen.bin::yamalanmamış upstream sürüm -- 14.00'te her uygulama açılışında donar"
            exit 1
          fi
          if [ "$got" != "$patched" ]; then
            echo "::error file=hen.bin::md5 $got, beklenen $patched"
            exit 1
          fi
          if ! grep -qE '^hen\.bin #[0-9a-f]{32}$' cache.appcache; then
            echo "::error file=cache.appcache::hen.bin manifestte yok -- cihaz önbelleğine girmez"
            exit 1
          fi
          echo "hen.bin: yamalı sürüm doğrulandı ve manifestte listeli"
